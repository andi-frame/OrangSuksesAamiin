name: ci

on:
  push:
    branches: [main, dev, staging]
  pull_request:

jobs:
  test:
    name: fmt / vet / test (every Go module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - run: make fmt
      - run: make vet
      - run: make test-race

  secrets:
    name: no committed credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: .env is neither tracked nor missing its example
        run: |
          ! git ls-files --error-unmatch .env 2>/dev/null
          test -f .env.example

  smoke:
    name: docker compose up + P1 scenario
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: start the whole system with one command
        run: |
          cp .env.example .env
          docker compose up -d --build
          bash scripts/wait-healthy.sh 180
      - name: Kafka topic was created
        run: |
          # the HTTP services become healthy before Kafka finishes booting: wait for the one-shot job
          for i in $(seq 1 60); do
            state=$(docker compose ps -a --format '{{.State}}|{{.ExitCode}}' kafka-init)
            [ "$state" = "exited|0" ] && break
            [ "${state%%|*}" = "exited" ] && break
            sleep 3
          done
          docker compose logs kafka-init
          docker compose logs kafka-init | grep "topic hazard.events ready"
      - name: P1 - schema evolution without restart
        run: make demo-p1
      - name: store and broker are unreachable from other containers
        run: make demo-isolation
      - name: logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: docs/evidence/
