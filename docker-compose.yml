# One command starts everything:   cp .env.example .env && docker compose up --build
#
# Network layout = who may talk to whom (this is also the proof for Problem 4
# that the Canonical Store is reachable by the Aggregator only):
#   app-net        HTTP between services (mocks, aggregator, client-facing API, auth)
#   canonical-net  internal: PostgreSQL <-> Aggregator only
#   broker-net     internal: Kafka <-> producer (Aggregator) and consumers
# PostgreSQL and Kafka publish no port to the host.
name: bnpb

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  # ------------------------------------------------------------------ mocks
  bmkg-mock:
    build: {context: ., dockerfile: services/bmkg-mock/Dockerfile}
    environment:
      BMKG_PORT: "8081"
      BMKG_API_KEY: ${BMKG_API_KEY:?copy .env.example to .env}
      BMKG_ADMIN_TOKEN: ${BMKG_ADMIN_TOKEN:?copy .env.example to .env}
      BMKG_DELAY_MIN_MS: ${BMKG_DELAY_MIN_MS:-50}
      BMKG_DELAY_MAX_MS: ${BMKG_DELAY_MAX_MS:-150}
      BMKG_EVENT_INTERVAL_SEC: ${BMKG_EVENT_INTERVAL_SEC:-10}
      BMKG_WARNING_DELAY_MIN_SEC: ${BMKG_WARNING_DELAY_MIN_SEC:-2}
      BMKG_WARNING_DELAY_MAX_SEC: ${BMKG_WARNING_DELAY_MAX_SEC:-8}
      BMKG_SEED_COUNT: ${BMKG_SEED_COUNT:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["${BMKG_PORT:-8081}:8081"]
    networks: [app-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    logging: *logging
    restart: unless-stopped

  pvmbg-mock:
    build: {context: ., dockerfile: services/pvmbg-mock/Dockerfile}
    environment:
      PVMBG_PORT: "8082"
      PVMBG_TOKEN_SECRET: ${PVMBG_TOKEN_SECRET:?copy .env.example to .env}
      PVMBG_ADMIN_TOKEN: ${PVMBG_ADMIN_TOKEN:?copy .env.example to .env}
      PVMBG_DELAY_MIN_MS: ${PVMBG_DELAY_MIN_MS:-500}
      PVMBG_DELAY_MAX_MS: ${PVMBG_DELAY_MAX_MS:-3000}
      PVMBG_REPORT_INTERVAL_SEC: ${PVMBG_REPORT_INTERVAL_SEC:-10}
      PVMBG_SEED_COUNT: ${PVMBG_SEED_COUNT:-24}
      PVMBG_HANG_MAX_SEC: ${PVMBG_HANG_MAX_SEC:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["${PVMBG_PORT:-8082}:8082"]
    networks: [app-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    logging: *logging
    restart: unless-stopped

  # -------------------------------------------------------------- aggregator
  aggregator:
    build: {context: ., dockerfile: services/aggregator/Dockerfile}
    environment:
      AGGREGATOR_PORT: "8083"
      AGGREGATOR_SERVICE_KEY: ${AGGREGATOR_SERVICE_KEY:?copy .env.example to .env}
      # M2: BNPB Internal Ops (dead letters) and the auditor (Audit API) have their own credentials
      AGGREGATOR_OPS_TOKEN: ${AGGREGATOR_OPS_TOKEN:?copy .env.example to .env}
      SATELLITE_FEED_TOKEN: ${SATELLITE_FEED_TOKEN:-}
      SATELLITE_FEED_URL: ${SATELLITE_FEED_URL:-https://satellite.naufarrel.dev}
      SATELLITE_LATENESS_SEC: ${SATELLITE_LATENESS_SEC:-86400}
      SATELLITE_START_FROM: ${SATELLITE_START_FROM:-latest}
      AUDIT_TOKEN: ${AUDIT_TOKEN:?copy .env.example to .env}
      # one instance in compose: no election (Kubernetes runs >= 3 with LEADER_ELECTION=kubernetes)
      LEADER_ELECTION: none
      SCHEMA_RULES_PATH: /app/rules/schema-rules.json
      # the two upstream credentials are independent; neither works on the other agency
      BMKG_URL: http://bmkg-mock:8081
      BMKG_API_KEY: ${BMKG_API_KEY:?copy .env.example to .env}
      PVMBG_URL: http://pvmbg-mock:8082
      PVMBG_GATEWAY_TOKEN: ${PVMBG_GATEWAY_TOKEN:?copy .env.example to .env}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-3}
      POLL_OVERLAP_SEC: ${POLL_OVERLAP_SEC:-5}
      SOURCE_TIMEOUT_SEC: ${SOURCE_TIMEOUT_SEC:-5}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-3}
      BREAKER_OPEN_SEC: ${BREAKER_OPEN_SEC:-10}
      PENDING_WARNING_TTL_SEC: ${PENDING_WARNING_TTL_SEC:-120}
      MESSAGE_MAX_BYTES: ${MESSAGE_MAX_BYTES:-1048576}
      MESSAGE_MAX_DEPTH: ${MESSAGE_MAX_DEPTH:-32}
      DLQ_MAX_ATTEMPTS: ${DLQ_MAX_ATTEMPTS:-8}
      DLQ_BASE_BACKOFF_SEC: ${DLQ_BASE_BACKOFF_SEC:-2}
      DLQ_MAX_BACKOFF_SEC: ${DLQ_MAX_BACKOFF_SEC:-120}
      REPOSITORY_BACKEND: ${REPOSITORY_BACKEND:-postgres}
      PUBLISHER_BACKEND: ${PUBLISHER_BACKEND:-kafka}
      RELAY_INTERVAL_MS: ${RELAY_INTERVAL_MS:-500}
      RELAY_BATCH: ${RELAY_BATCH:-100}
      RELAY_MAX_BACKOFF_SEC: ${RELAY_MAX_BACKOFF_SEC:-10}
      CANONICAL_DB_URL: postgres://${CANONICAL_DB_USER:-canonical}:${CANONICAL_DB_PASSWORD:?copy .env.example to .env}@postgres-canonical:5432/${CANONICAL_DB_NAME:-canonical}?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hazard.events}
      # M2 P5: Sensor Pantai (we run the assistants' image; the token is ours, same value on both sides)
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-}
      SENSOR_PANTAI_URL: http://sensor-pantai:8080
      SENSOR_POLL_INTERVAL_MS: ${SENSOR_POLL_INTERVAL_MS:-1000}
      SENSOR_TIMEOUT_SEC: ${SENSOR_TIMEOUT_SEC:-2}
      SENSOR_BREAKER_OPEN_SEC: ${SENSOR_BREAKER_OPEN_SEC:-10}
      SENSOR_FREEZE_AFTER_SEC: ${SENSOR_FREEZE_AFTER_SEC:-15}
      SENSOR_MAX_LAG_SEC: ${SENSOR_MAX_LAG_SEC:-7200}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: ["./deploy/k8s/schema-rules.json:/app/rules/schema-rules.json:ro"]
    # loopback only: the internal API is for operators/demo scripts; clients use the Client-Facing API (8080)
    ports: ["127.0.0.1:${AGGREGATOR_PORT:-8083}:8083"]
    networks: [app-net, canonical-net, broker-net]
    # no depends_on on the mocks or the store: the Aggregator must start,
    # keep serving and recover on its own while any of them is absent (Problem 2/4)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    logging: *logging
    restart: unless-stopped

  # ---------------------------------------------------------- canonical store
  postgres-canonical:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CANONICAL_DB_USER:-canonical}
      POSTGRES_PASSWORD: ${CANONICAL_DB_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${CANONICAL_DB_NAME:-canonical}
    volumes: [canonical-pgdata:/var/lib/postgresql/data]
    networks: [canonical-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------- broker
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # the topic is created explicitly by kafka-init
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [broker-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hazard.events}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      # + field-reports, field-reports.processed (defaults of create-topic.sh)
    volumes: [./deploy/kafka/create-topic.sh:/create-topic.sh:ro]
    entrypoint: ["/bin/sh", "/create-topic.sh"]
    networks: [broker-net]
    restart: "no"

  # ----------------------------------------------------------- auth (Orang 2)
  auth-service:
    build: {context: ., dockerfile: services/auth-service/Dockerfile}
    environment:
      AUTH_SERVICE_PORT: "8084"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?copy .env.example to .env}
      AUTH_ACCESS_TTL_SEC: ${AUTH_ACCESS_TTL_SEC:-60}
      AUTH_REFRESH_TTL_SEC: ${AUTH_REFRESH_TTL_SEC:-86400}
      AUTH_MEDIA_CLIENT_ID: ${AUTH_MEDIA_CLIENT_ID:?copy .env.example to .env}
      AUTH_MEDIA_CLIENT_SECRET: ${AUTH_MEDIA_CLIENT_SECRET:?copy .env.example to .env}
      AUTH_LAPANGAN_CLIENT_ID: ${AUTH_LAPANGAN_CLIENT_ID:?copy .env.example to .env}
      AUTH_LAPANGAN_CLIENT_SECRET: ${AUTH_LAPANGAN_CLIENT_SECRET:?copy .env.example to .env}
      AUTH_PUSAT_CLIENT_ID: ${AUTH_PUSAT_CLIENT_ID:?copy .env.example to .env}
      AUTH_PUSAT_CLIENT_SECRET: ${AUTH_PUSAT_CLIENT_SECRET:?copy .env.example to .env}
      AUTH_DB_PATH: /data/auth.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["${AUTH_SERVICE_PORT:-8084}:8084"]
    volumes: [auth-data:/data]
    networks: [app-net, auth-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    logging: *logging
    restart: unless-stopped

  client-api:
    build: {context: ., dockerfile: services/client-api/Dockerfile}
    environment:
      CLIENT_API_PORT: "8080"
      AGGREGATOR_URL: http://aggregator:8083
      AGGREGATOR_SERVICE_KEY: ${AGGREGATOR_SERVICE_KEY:?copy .env.example to .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?copy .env.example to .env}
      AGGREGATOR_TIMEOUT_SEC: ${AGGREGATOR_TIMEOUT_SEC:-10}
      CLIENT_RATE_LIMIT_RPS: ${CLIENT_RATE_LIMIT_RPS:-500}
      CLIENT_RATE_LIMIT_BURST: ${CLIENT_RATE_LIMIT_BURST:-1000}
      CLIENT_PRIORITY_RESERVE: ${CLIENT_PRIORITY_RESERVE:-0.3}
      CLIENT_MAX_IN_FLIGHT: ${CLIENT_MAX_IN_FLIGHT:-64}
      # M2 P3 criterion 6: field reports are made durable in Kafka before the 202
      KAFKA_BROKERS: kafka:9092
      FIELD_REPORT_ACK_TIMEOUT_SEC: ${FIELD_REPORT_ACK_TIMEOUT_SEC:-5}
      FIELD_REPORTS_URL: http://field-reports:8093
      AUTH_URL: http://auth-service:8084
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["${CLIENT_API_PORT:-8080}:8080"]
    networks: [app-net, broker-net]
    depends_on:
      aggregator: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    logging: *logging
    restart: unless-stopped

  consumer-dashboard:
    build: {context: ., dockerfile: services/consumer-hazard/Dockerfile}
    environment:
      CONSUMER_NAME: dashboard
      CONSUMER_PORT: "8091"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hazard.events}
      KAFKA_GROUP: dashboard-updater
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["${CONSUMER_DASHBOARD_PORT:-8091}:8091"]
    # broker-net is internal (no host port can be published through it); app-net only carries the /health + /stats port
    networks: [broker-net, app-net]
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logging
    restart: unless-stopped

  consumer-notifier:
    build: {context: ., dockerfile: services/consumer-hazard/Dockerfile}
    environment:
      CONSUMER_NAME: notifier
      CONSUMER_PORT: "8092"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hazard.events}
      KAFKA_GROUP: notifier
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["${CONSUMER_NOTIFIER_PORT:-8092}:8092"]
    # broker-net is internal (no host port can be published through it); app-net only carries the /health + /stats port
    networks: [broker-net, app-net]
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------- M2: field reports (Orang 2, P3 criterion 6)
  field-reports:
    build: {context: ., dockerfile: services/field-reports/Dockerfile}
    environment:
      FIELD_REPORTS_PORT: "8093"
      KAFKA_BROKERS: kafka:9092
      FIELD_REPORT_PROCESS_DELAY_MS: ${FIELD_REPORT_PROCESS_DELAY_MS:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["127.0.0.1:${FIELD_REPORTS_PORT:-8093}:8093"]
    networks: [broker-net, app-net]
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8093/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------- M2: Sensor Pantai (assistants' image, unmodified; P5)
  sensor-pantai:
    image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
    platform: linux/amd64
    environment:
      PANTAI_PROFILE: ${PANTAI_PROFILE:-practice}
      PANTAI_SEED: "42"
      PANTAI_SPEED: "60"
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-}
    ports: ["127.0.0.1:${SENSOR_PANTAI_PORT:-8094}:8080"]
    networks: [app-net]
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------- M2: observability (docker compose --profile obs up -d)
  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.62.0
    command: ["--memory.max-traces=3000"]
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["127.0.0.1:16686:16686"]
    networks: [app-net, broker-net]
    logging: *logging
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
    volumes: ["./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./deploy/compose/rules.yml:/etc/prometheus/rules.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [app-net, broker-net]
    logging: *logging
  grafana:
    profiles: [obs]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/argus-overview.json
    volumes:
      - ./deploy/compose/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./deploy/compose/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./deploy/grafana/argus-overview.json:/var/lib/grafana/dashboards/argus-overview.json:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [app-net]
    logging: *logging

networks:
  app-net: {}
  auth-net: {internal: true}
  canonical-net: {internal: true}
  broker-net: {internal: true}

volumes:
  auth-data: {}
  canonical-pgdata: {}
  kafka-data: {}
