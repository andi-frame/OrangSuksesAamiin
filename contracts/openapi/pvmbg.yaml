openapi: 3.0.3
info:
  title: PVMBG mock (M1 contract)
  version: "1.0"
  description: |
    Slow, fluctuating "legacy" volcano service: random response delay 500 ms - 3 s (configurable, also at runtime).
    Credential: `Authorization: Bearer <pvmbg-token>` where the token is `pvmbg.v1.<claims>.<hmac>` signed with a
    secret only PVMBG knows. No credential is 401 (an expired PVMBG token too); anything else, including a BMKG key,
    is 403.
    Entity schema: contracts/schemas/volcanic-report.json (confidence_level is optional).
servers:
  - url: http://localhost:8082
paths:
  /volcanic-reports:
    get:
      summary: VolcanicReports reported strictly after `since` (ascending by reported_at)
      security: [{pvmbgBearer: []}]
      parameters:
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        "200": {description: "JSON array of VolcanicReport", content: {application/json: {schema: {type: array, items: {$ref: "../schemas/volcanic-report.json"}}}}}
        "400": {description: since is not ISO 8601}
        "401": {description: missing or expired token}
        "403": {description: invalid token / credential of another agency}
        "503": {description: outage in mode "error" (mode "hang" never answers)}
  /health:
    get:
      summary: Health check (no credential; stays answerable during an outage and reports it)
      responses:
        "200": {description: "{status, service, time, reports, outage, schema_version}"}
  /admin/schema-version:
    post:
      summary: |
        Change the schema of NEW reports while running (no restart): confidence_level (compatible, M1) and, since M2,
        incompatible changes - rename (alert_level -> level), type_change (reported_at -> Unix seconds, number),
        drop_required (volcano_id removed; the code moves to location.volcano_code). Reports created earlier keep their shape.
      security: [{adminToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confidence_level: {type: boolean}
                version: {type: integer, enum: [1, 2, 3], description: "1 = original schema, 2 = with confidence_level, 3 (M2) = every incompatible change"}
                mode: {type: string, enum: [original, compatible, incompatible], description: "(M2) alias of version 1 / 2 / 3"}
                incompatible:
                  type: array
                  items: {type: string, enum: [rename, type_change, drop_required]}
                  description: "(M2) the incompatible changes to apply; [] = none"
                extra_fields: {type: object, description: "(addition) arbitrary fields added to every new report; {} clears"}
      responses:
        "200": {description: "current state (schema_version, incompatible_changes, ...)"}
        "400": {description: unknown version / mode / change}
  /admin/malformed:
    post:
      summary: |
        (M2 addition) make PVMBG send broken messages: truncated = the next `count` responses are cut off inside their
        last element; deep / invalid_utf8 / oversize = a stored report whose bytes are broken (sent while it is in the
        requested since-window).
      security: [{adminToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [truncated, deep, invalid_utf8, oversize]}
                count: {type: integer, default: 1, maximum: 100, description: truncated only}
                depth: {type: integer, default: 100000, maximum: 2000000, description: deep only}
                size_bytes: {type: integer, default: 2097152, maximum: 16777216, description: oversize only}
      responses:
        "200": {description: "{kind, report_id, bytes} or {kind, truncated_responses}"}
        "400": {description: unknown kind}
  /admin/outage:
    post:
      summary: Turn the outage on/off instantly
      security: [{adminToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
                mode: {type: string, enum: [error, hang], default: error, description: "error = immediate 503; hang = no answer until the client gives up"}
      responses:
        "200": {description: current state}
  /admin/delay:
    post:
      summary: (addition) change the response delay at runtime, e.g. {"ms":3000} for the P2 scenario
      security: [{adminToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ms: {type: integer}
                min_ms: {type: integer}
                max_ms: {type: integer}
      responses:
        "200": {description: current state}
  /admin/generate:
    post:
      summary: (addition) create reports on demand; `override` merges fields into their wire format (null removes one) to simulate unsupported schema changes
      security: [{adminToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: {type: integer, default: 1, maximum: 500}
                volcano_id: {type: string}
                alert_level: {type: string, enum: [Normal, Waspada, Siaga, Awas]}
                override: {type: object}
      responses:
        "200": {description: "{generated:[VolcanicReport]}"}
  /admin/state:
    get:
      summary: (addition) current runtime state
      security: [{adminToken: []}]
      responses:
        "200": {description: state}
components:
  securitySchemes:
    pvmbgBearer: {type: http, scheme: bearer}
    adminToken: {type: apiKey, in: header, name: X-Admin-Token}
