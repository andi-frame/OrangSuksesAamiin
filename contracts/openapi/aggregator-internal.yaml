openapi: 3.0.3
info:
  title: Aggregator internal API (M1 + M2)
  version: "2.0"
  description: |
    The Canonical Store is private to the Aggregator. Every other component (the Client-Facing API in particular)
    reads hazards ONLY through this API. It returns the full HazardEvent (including Mentah fields); the Client-Facing
    API is what restricts fields per client.

    Three principals, three independent credentials (M2):
      - `X-Service-Key` (Client-Facing API): /internal/hazards, /internal/sources/status, /internal/leader. 401 missing, 403 wrong.
      - `Authorization: Bearer <ops-token>` (BNPB Internal Ops): /internal/ops/*. The service key does NOT open these.
      - `Authorization: Bearer <audit-token>` (auditor, Lampiran A): /internal/audit/*.
    Bearer endpoints: missing / unknown token = 401, a valid token of another principal = 403.
    Every error body: {"error":{"code":"...","message":"..."}}.

    M2: several instances run behind one Service; every instance answers every endpoint (reads go to the store).
servers:
  - url: http://127.0.0.1:8083
paths:
  /internal/hazards:
    get:
      summary: List hazards, newest first (occurred_at DESC, hazard_id DESC), keyset pagination
      security: [{serviceKey: []}]
      parameters:
        - {name: hazard_type, in: query, schema: {type: string, enum: [SEISMIC, VOLCANIC, WILDFIRE, COASTAL]}}
        - {name: source, in: query, schema: {type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI]}}
        - {name: severity, in: query, schema: {type: string, enum: [NORMAL, WASPADA, SIAGA, AWAS]}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: "occurred_at >= since"}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
        - {name: cursor, in: query, schema: {type: string}, description: "opaque next_cursor of the previous page"}
      responses:
        "200":
          description: |
            {items:[HazardEvent], next_cursor:"" | "...", freshness:{BMKG:{state,last_success_at,stale_since}, PVMBG:{...}}}.
            The response also includes partial and unavailable_units.
            `freshness.<source>.stale_since` is non-null while the source is not "up": the data of that source is at
            least that old. M2: freshness is the view the LEADER stored (every instance serves the same one); a view
            older than SOURCE_STATUS_MAX_AGE_SEC (store clock) means nobody polls: state "unknown", stale_since set.
        "400": {description: bad filter}
        "401": {description: missing key}
        "403": {description: wrong key}
        "503": {description: canonical store unavailable}
  /internal/hazards/{id}:
    get:
      security: [{serviceKey: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: HazardEvent, content: {application/json: {schema: {$ref: "../schemas/hazard-event.json"}}}}
        "404": {description: not found}
  /internal/sources/status:
    get:
      summary: Health of each upstream as seen by the leader (state, breaker, last_success_at, stale_since, polled_by, status_age_s)
      security: [{serviceKey: []}]
      responses:
        "200": {description: "{sources:[Status], unprocessed:{SOURCE:{retrying:n, parked:n}}} (counts only)"}
  /internal/satellite/status:
    get:
      summary: Most recent persisted Feed Satelit checkpoint and lag
      security: [{serviceKey: []}]
      responses:
        "200":
          description: "{source, state, last_success_at, applied_offset, last_session_head, lag_offsets, late_detections, singletons, status_age_s}"
        "404": {description: No satellite checkpoint yet}
        "503": {description: Canonical store unavailable}
  /internal/leader:
    get:
      summary: (M2) leader election state of THIS instance
      security: [{serviceKey: []}]
      responses:
        "200": {description: "{election:'kubernetes', instance:{identity, leader, term, observed_holder, observed_term, leader_since, lease_name}} or {election:'none', leader:true}"}
  /internal/ops/unprocessed:
    get:
      summary: (M2, Internal Ops) messages that could not be processed, oldest first, with their exact bytes
      security: [{opsToken: []}]
      parameters:
        - {name: source, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [retrying, parked, resolved, all]}, description: "default: retrying + parked"}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: raw, in: query, schema: {type: boolean, default: true}, description: "false = leave out raw_text / raw_base64"}
      responses:
        "200":
          description: |
            {items:[{message_id, source, received_at, reason, retryable, attempts, status, seq, kind, record_key,
            next_attempt_at, resolved_at, correlation_id, raw_size, raw_stored_bytes, raw_text|null, raw_base64}],
            next_cursor: string|null, open:{SOURCE:{retrying:n, parked:n}}}
        "400": {description: bad parameter}
  /internal/ops/unprocessed/{id}:
    get:
      summary: (M2, Internal Ops) one message, any status
      security: [{opsToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: same item shape as the list}
        "404": {description: not found}
  /internal/ops/unprocessed/reprocess:
    post:
      summary: |
        (M2, Internal Ops) move parked messages back to "retrying", due now. The leader retries them in arrival order
        per record (source + kind + record_key), through the current code and schema rules.
      security: [{opsToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source: {type: string, description: "empty = every source"}
                message_ids: {type: array, items: {type: string}, description: "empty = every parked message of source"}
      responses:
        "202": {description: "{requeued:n, note}"}
  /internal/ops/schema-rules:
    get:
      summary: (M2, Internal Ops) schema adaptation rules loaded by this instance
      security: [{opsToken: []}]
      responses:
        "200": {description: "{rules:[\"PVMBG rename level -> alert_level\", ...]}"}
  /internal/audit/events:
    get:
      summary: List active canonical hazards by ingested_at and hazard_id, ascending
      security: [{auditToken: []}]
      parameters:
        - {name: source, in: query, schema: {type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI]}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: Inclusive ingested_at}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque next_cursor from this route}
      responses:
        "200":
          description: Canonical records and coverage
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, partial, unavailable_units]
                properties:
                  items: {type: array, items: {$ref: "../schemas/hazard-event.json"}}
                  next_cursor: {type: string, nullable: true}
                  partial: {type: boolean}
                  unavailable_units: {type: array, items: {type: string}}
        "400": {description: Invalid query}
        "401": {description: Missing or invalid token}
        "403": {description: Wrong principal}
        "503": {description: Store unavailable}
  /internal/audit/checksum:
    get:
      summary: Count active records and hash byte-sorted source_ref_id values joined by LF
      security: [{auditToken: []}]
      parameters:
        - {name: source, in: query, schema: {type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI]}}
      responses:
        "200":
          description: Digest and coverage
          content:
            application/json:
              schema:
                type: object
                required: [source, count, checksum, algorithm, as_of, partial, unavailable_units]
                properties:
                  source: {type: string, description: Empty for all sources}
                  count: {type: integer, minimum: 0}
                  checksum: {type: string, pattern: "^[a-f0-9]{64}$"}
                  algorithm: {type: string, enum: [sha256]}
                  as_of: {type: string, format: date-time}
                  partial: {type: boolean}
                  unavailable_units: {type: array, items: {type: string}}
        "400": {description: Invalid source}
        "401": {description: Missing or invalid token}
        "403": {description: Wrong principal}
        "503": {description: Store unavailable}
  /internal/audit/location:
    get:
      summary: Verify physical placement of an active canonical hazard
      security: [{auditToken: []}]
      parameters:
        - {name: hazard_id, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Verified physical placements
          content:
            application/json:
              schema:
                type: object
                required: [hazard_id, locations, partial]
                properties:
                  hazard_id: {type: string}
                  partial: {type: boolean}
                  locations:
                    type: array
                    items:
                      type: object
                      required: [node, unit, role]
                      properties:
                        node: {type: string}
                        unit: {type: string}
                        role: {type: string, enum: [primary, replica]}
        "400": {description: Missing hazard_id}
        "401": {description: Missing or invalid token}
        "403": {description: Wrong principal}
        "404": {description: Authoritative shard confirmed absence}
        "503": {description: Store unavailable}
  /internal/audit/unprocessed:
    get:
      summary: (M2, Lampiran A) open messages (retrying, parked), oldest first; metadata only
      security: [{auditToken: []}]
      parameters:
        - {name: source, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: "{items:[{message_id, source, received_at, reason, retryable, attempts, status}], next_cursor: string|null}"}
        "400": {description: bad parameter}
        "401": {description: missing or invalid token}
        "403": {description: token of another principal}
  /health:
    get: {summary: "liveness (no credential); includes the build version", responses: {"200": {description: ok}}}
  /ready:
    get: {summary: readiness = canonical store reachable (no credential), responses: {"200": {description: ready}, "503": {description: store down}}}
components:
  securitySchemes:
    serviceKey: {type: apiKey, in: header, name: X-Service-Key}
    opsToken: {type: http, scheme: bearer, description: AGGREGATOR_OPS_TOKEN}
    auditToken: {type: http, scheme: bearer, description: AUDIT_TOKEN (given by the assistants)}
