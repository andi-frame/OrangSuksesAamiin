apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sistem-informasi-kebencanaan-bnpb
resources:
  - ../../deploy
  - postgresql.yaml
patches:
  - path: aggregator-patch.yaml
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-canonical
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-canonical
      $patch: delete
images:
  - {name: argus/canonical-shard, newTag: dev}
