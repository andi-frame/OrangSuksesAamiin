# "One storage, one owner" enforced by the platform (M2 Ketentuan Implementasi).
# Only ingress to storage is restricted: every other pod, and the Tester Agent (own namespace,
# host network), is untouched. k3s enforces NetworkPolicy out of the box (kube-router).
#
# Canonical Store: only Aggregator pods may connect. A pod that merely copies the label from
# another namespace is not matched (no namespaceSelector = this namespace only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canonical-store-only-aggregator
spec:
  podSelector: {matchLabels: {app: postgres-canonical}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {bnpb.io/canonical-client: "true"}
            matchExpressions:
              - {key: app, operator: In, values: [aggregator, canonical-migration]}
      ports: [{protocol: TCP, port: 5432}]
---
# Broker: producer (Aggregator), consumers and the topic job only.
# The broker itself is allowed too: Kafka transactions (field-report processor, M2 P3 criterion 6) make the
# broker send AddPartitionsToTxn to itself through its advertised listener (kafka:9092); without this rule the
# request is dropped and every transaction hangs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-only-kafka-clients
spec:
  podSelector: {matchLabels: {app: kafka}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {bnpb.io/kafka-client: "true"}}
        - podSelector: {matchLabels: {app: kafka}}
      ports: [{protocol: TCP, port: 9092}]
